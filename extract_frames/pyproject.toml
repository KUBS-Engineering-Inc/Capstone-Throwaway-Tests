[project]
name = "extract-frames"
version = "0.1.0"
description = "Extract frames from ultrasound videos"
readme = "README.md"
authors = [
    { name = "BaoGeist", email = "linofbaoze@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "opencv-python>=5.0.0.93",
]

[project.scripts]
extract-frames = "extract_frames.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
